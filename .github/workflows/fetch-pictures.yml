# The redesign branch only: fetches pictures from The Metropolitan Museum of Art's Open Access collection (CC0) and
# commits them back to the branch, for choosing each page's sculpture (pieces-candidates/) and for the chosen pieces
# with their credits (web/scripts/pieces.list.json, fetched by web/scripts/fetch-images.ts). It never publishes the site.
name: Fetch pictures (redesign branch)

on:
  push:
    branches: [claude/site-redesign-77uoc2]
    paths: [pieces-candidates/list.json, web/scripts/pieces.list.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-pictures
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Candidates (small pictures)
        if: hashFiles('pieces-candidates/list.json') != ''
        run: node pieces-candidates/fetch.mjs
      - name: Install (for the chosen pieces)
        if: hashFiles('web/scripts/pieces.list.json') != ''
        working-directory: web
        run: npm ci
      - name: Chosen pieces, with their credits
        if: hashFiles('web/scripts/pieces.list.json') != ''
        working-directory: web
        env: { LIST: scripts/pieces.list.json, OUT: src/data/piece-images.json, DIR: public/images/pieces, SMALL: "0" }
        run: npx tsx scripts/fetch-images.ts
      - name: Commit what was fetched
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A pieces-candidates web/public/images/pieces web/src/data/piece-images.json 2>/dev/null || true
          git diff --cached --quiet || { git commit -m "Fetch pictures from the Met's Open Access collection"; git push; }
