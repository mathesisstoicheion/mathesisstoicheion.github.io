# The lyre branch only (the owner allowed it, 2026-10-16): fetches Stefan Hagel's MIDI renderings of the surviving ancient
# Greek melodies (Austrian Academy of Sciences, "Ancient Greek Music: The Melodies") and a few reference pages into
# music-sources/ on this branch, because the cloud container that builds the lyre cannot reach those sites. They are research
# material for web/src/data/melodies; the site never loads them. It never publishes the site.
name: Fetch music sources (lyre branch)

on:
  push:
    branches: [claude/greek-lyre-miz7dq]
    paths: [music-sources/list.txt]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-music
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch
        run: |
          cd music-sources
          rm -f failed.txt
          while read -r name url; do
            [ -z "$name" ] && continue
            case "$name" in \#*) continue;; esac
            curl -sSL --fail -A "Mozilla/5.0 (mathesisstoicheion.com research)" -o "$name" "$url" || echo "FAILED $name $url" >> failed.txt
            sleep 1
          done < list.txt
          ls -la
      - name: Commit what was fetched
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A music-sources
          git diff --cached --quiet || { git commit -m "Fetch music sources for the lyre"; git push; }
