name: Android beta app

# Builds the phone app (android/) with the whole site inside it. The app comes out unsigned; it is signed
# afterwards with the app's private key, which is never in this public repository. Never touches the live site.
on:
  push:
    branches: [claude/project-thread-dk7dln]
  workflow_dispatch:

permissions:
  contents: write  # only for the android-beta-builds branch below

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the site
        working-directory: web
        run: npm ci && npm run build
        env:
          # the same settings as the live site (deploy.yml)
          NEXT_PUBLIC_PACKS: /packs
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}

      - name: Put the site inside the app
        run: mkdir -p android/app/src/main/assets && cp -r web/out android/app/src/main/assets/site

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build the app
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      - name: Check the site's code and accounts made it into the app
        run: |
          APK=android/app/build/outputs/apk/release/app-release-unsigned.apk
          unzip -l "$APK" | grep -q "assets/site/_next/static/" || { echo "the site's code (_next) is missing from the app"; exit 1; }
          unzip -l "$APK" | grep -q "assets/site/index.html" || { echo "the home page is missing from the app"; exit 1; }
          mkdir /tmp/code && unzip -q "$APK" 'assets/site/_next/static/*' -d /tmp/code
          grep -rqs "supabase.co" /tmp/code || echo "::warning::no Supabase address in the site's code: sign-in will be off in this app"

      # The unsigned app goes to its own branch, in parts under GitHub's 100 MB file limit, for signing. The branch
      # holds only the latest build (one commit, replaced each time) and is never merged.
      - name: Hand over the unsigned app
        run: |
          mkdir /tmp/handover && cd /tmp/handover
          split -b 45m -d "$GITHUB_WORKSPACE"/android/app/build/outputs/apk/release/app-release-unsigned.apk app-unsigned.apk.part
          sha256sum "$GITHUB_WORKSPACE"/android/app/build/outputs/apk/release/app-release-unsigned.apk | cut -d' ' -f1 > app-unsigned.sha256
          echo "${{ github.run_number }}" > build-number
          git init -q -b android-beta-builds
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "Unsigned beta ${{ github.run_number }} from ${{ github.sha }}" --allow-empty
          git add . && git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -q --amend -m "Unsigned beta ${{ github.run_number }} from ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" android-beta-builds
