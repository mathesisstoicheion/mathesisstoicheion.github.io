name: Site checks

# The review fixes' detectors (web/scripts/check-*.mjs): run on every pull request and by hand. They never block the
# live site's deploy (deploy.yml), they only report.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci && npx playwright install --with-deps chromium
      - name: Build
        working-directory: web
        # the public Supabase values, as the deploy uses them, so the account page is the one visitors see (slice 9)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build
      - name: Serve the build
        working-directory: web
        run: (node scripts/serve-out.mjs 3100 &) && sleep 2
      - name: Words visible on first paint (slice 1)
        working-directory: web
        run: npm run check:first-paint
      - name: Overlays hold the page, close on Escape, give focus back (slice 5)
        working-directory: web
        run: npm run check:overlays
      - name: One name per room (slice 2)
        working-directory: web
        run: node scripts/check-names.mjs
      - name: The two lesson tracks agree everywhere (slice 4)
        working-directory: web
        run: node scripts/check-lessons.mjs http://localhost:3100
      - name: Dates in BC and AD, once (slice 6)
        working-directory: web
        run: node scripts/check-eras.mjs
      - name: The library reads clearly over its letters, every author with a line (slice 6)
        working-directory: web
        run: node scripts/check-library.mjs http://localhost:3100
      - name: The home page is in order (slice 7)
        working-directory: web
        run: node scripts/check-home.mjs http://localhost:3100
      - name: The reader (slice 8)
        working-directory: web
        run: node scripts/check-reader.mjs http://localhost:3100
      - name: The other rooms (slice 9)
        working-directory: web
        run: node scripts/check-rooms.mjs http://localhost:3100
