name: Site checks

# The review fixes' detectors (web/scripts/check-*.mjs): run on every pull request and by hand. They never block the
# live site's deploy (deploy.yml), they only report.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci && npx playwright install --with-deps chromium
      - name: Build
        working-directory: web
        run: npm run build
      - name: Serve the build
        working-directory: web
        run: (node scripts/serve-out.mjs 3100 &) && sleep 2
      - name: Words visible on first paint (slice 1)
        working-directory: web
        run: npm run check:first-paint
      - name: Overlays hold the page, close on Escape, give focus back (slice 5)
        working-directory: web
        run: npm run check:overlays
      - name: One name per room (slice 2)
        working-directory: web
        run: node scripts/check-names.mjs
