<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mathesis Stoicheion</title>
<meta name="description" content="Mathesis Stoicheion is closed for a redesign and will be back soon.">
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital@0;1&display=swap" rel="stylesheet">
<style>
  /* The holding page while the site is closed for its redesign (see DEPLOYMENT.md, "Closed for a redesign").
     The home page's Pompeian red, gold and bone, nothing else. */
  :root { --gold: #e8bd70; --bone: #f2e0c6; --bone-2: #c39f83; --red: #5c1910; --red-deep: #1b0907; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    display: grid; place-items: center; padding: 24px 16px;
    background: radial-gradient(ellipse at 50% 40%, var(--red) 0%, var(--red-deep) 75%) fixed, var(--red-deep);
    color: var(--bone); font-family: "EB Garamond", Georgia, serif; text-align: center;
  }
  main { max-width: 34rem; }
  .mark { font-size: clamp(1.6rem, 6vw, 2.6rem); letter-spacing: .32em; color: var(--gold); padding-left: .32em; }
  .rule { width: 0; height: 1px; margin: 1.6rem auto; background: var(--gold); opacity: .7; }
  h1 { font-weight: 400; font-size: clamp(1.3rem, 4.4vw, 1.75rem); line-height: 1.35; }
  p { margin-top: .9rem; font-size: 1.1rem; line-height: 1.55; color: var(--bone-2); font-style: italic; }
  @media (prefers-reduced-motion: no-preference) {
    .mark, h1, p { opacity: 0; animation: rise 1.6s cubic-bezier(.2,.7,.2,1) forwards; }
    h1 { animation-delay: .9s; } p { animation-delay: 1.3s; }
    .rule { animation: draw 1.4s .5s cubic-bezier(.2,.7,.2,1) forwards; }
  }
  @media (prefers-reduced-motion: reduce) { .rule { width: 8rem; } }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes draw { to { width: 8rem; } }
</style>
</head>
<body>
<main>
  <div class="mark" lang="grc">ΣΤΟΙΧΕΙΑ</div>
  <div class="rule"></div>
  <h1>Mathesis Stoicheion is closed for a redesign.</h1>
  <p>We will be back soon.</p>
</main>
<script>
  // Returning visitors may still have the old site's offline helper; the new /sw.js removes it.
  if ("serviceWorker" in navigator) navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.update()));
</script>
</body>
</html>
